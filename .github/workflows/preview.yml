name: Preview

on:
  pull_request:

# 同じ PR に新しい push が来たら古い実行を取り消す
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  deploy:
    needs: check
    # フォークからの PR にはシークレットを渡さない
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    # プレビュー環境は全 PR で 1 つなので、PR をまたいでデプロイを直列化する
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:migrate:preview
      - run: pnpm build
        env:
          CLOUDFLARE_ENV: preview
          # Turnstile のテスト用サイトキー（常に成功・非表示）
          VITE_TURNSTILE_SITE_KEY: 1x00000000000000000000BB
      - id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # CLOUDFLARE_ENV でビルドした設定（dist/）を使うので --env は付けない
          command: deploy
      - name: プレビュー URL を PR にコメント
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = "<!-- leaction-preview -->";
            const sha = context.payload.pull_request.head.sha;
            const body = [
              marker,
              `### プレビュー`,
              "",
              `${process.env.DEPLOYMENT_URL}`,
              "",
              `コミット ${sha.slice(0, 7)} をデプロイしました。プレビュー環境は全 PR で共有しているので、ほかの PR が後から push すると内容が置き換わります。`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.user?.type === "Bot" && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
